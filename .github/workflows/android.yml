name: Android CI

on:
  push:
    branches: [ "master" ]
    tags:
      - "beta-v*"
      - "v*"
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "repository_name=Battery Plus" >> $GITHUB_ENV
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Decode signing keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_CERT_P12 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/signing_cert.p12
          else
            echo "Error: SIGNING_CERT_P12 secret is empty!"
            exit 1
          fi

      - name: Build signed release APK
        if: github.event_name == 'push'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Clean up signing keystore
        if: always()
        run: rm -f app/signing_cert.p12

      # Regular pushes to master -> upload as workflow artifact
      - name: Upload APK Artifact - ${{ env.repository_name }}
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.repository_name }}-${{ env.date_today }}-release
          path: app/build/outputs/apk/**/release/*.apk

      # Tag pushes (beta-v* or v*) -> publish GitHub Release with app-release.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Battery Plus ${{ env.tag_name }}
          files: app/build/outputs/apk/release/app-release.apk
          prerelease: ${{ contains(env.tag_name, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}