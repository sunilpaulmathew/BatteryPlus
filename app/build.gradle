plugins {
    alias(libs.plugins.android.application)
}

android {
    signingConfigs {
        release {
            def keystoreFile = file("signing_cert.p12")
            if (keystoreFile.exists() && System.getenv("KEYSTORE_PASSWORD") != null) {
                storeFile keystoreFile
                storeType "PKCS12"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    namespace 'in.sunilpaulmathew.batteryplus'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "in.sunilpaulmathew.batteryplus"
        minSdk 26
        targetSdk 37
        versionCode 5
        versionName "beta-v0.5"
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            optimization {
                enable true
            }
            minifyEnabled true
            shrinkResources true
            if (file("signing_cert.p12").exists() && System.getenv("KEYSTORE_PASSWORD") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.material
    implementation libs.preference
}